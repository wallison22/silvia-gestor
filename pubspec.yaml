name: silvia_gestor
publish_to: "none"
description: Aplicativo de gestao de tecidos, pecas e precificacao para costura artesanal.
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  file_picker: ^13.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1E3A8A"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
